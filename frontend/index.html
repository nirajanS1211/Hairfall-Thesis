<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hairfall Lab</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234f46e5'/%3E%3Cpath d='M11 23c0-6 2-10 5-14M16 23c0-5 1-9 3-12M21 23c0-4-1-7-2-9' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preload" href="/static/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="M7 20c0-6 2-11 6-15M12 20c0-5 1-9 4-12M17 20c0-4-1-7-2.5-9"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z" fill="currentColor"/></symbol>
    <symbol id="i-playall" viewBox="0 0 24 24"><path d="M4 5l8 7-8 7zM13 5l8 7-8 7z" fill="currentColor"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol>
    <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2h12.4a1.5 1.5 0 0 0 1.3-2L14 9V3"/><path d="M7 15h10"/></symbol>
    <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M12 14l4-4"/><path d="M3.3 19a10 10 0 1 1 17.4 0"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 5.6a5.5 5.5 0 0 0-7.8 0L12 6.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 22l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V16h8v-1.3A7 7 0 0 0 12 2z"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></symbol>
    <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 2.7s-6 6.3-6 11.3a6 6 0 0 0 12 0c0-5-6-11.3-6-11.3z"/></symbol>
    <symbol id="i-scissors" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/></symbol>
    <symbol id="i-steth" viewBox="0 0 24 24"><path d="M5 3v5a5 5 0 0 0 10 0V3"/><path d="M10 13v2a5 5 0 0 0 10 0v-2"/><circle cx="20" cy="11" r="2"/></symbol>
    <symbol id="i-food" viewBox="0 0 24 24"><path d="M3 11h18a9 9 0 0 1-18 0zM12 11V6M8 8l2 3M16 8l-2 3"/></symbol>
  </svg>

  <header class="topbar">
    <div class="brand"><span class="mark"><svg class="ic"><use href="#i-logo"/></svg></span><div>Hairfall Lab<small>Hair-fall risk prediction</small></div></div>
    <nav class="nav" id="nav">
      <button data-tab="predict"><svg class="ic"><use href="#i-shield"/></svg>Risk check</button>
      <button data-tab="notebook"><svg class="ic"><use href="#i-book"/></svg>Notebook</button>
      <button data-tab="compare"><svg class="ic"><use href="#i-chart"/></svg>Results</button>
      <button data-tab="dataset"><svg class="ic"><use href="#i-db"/></svg>Dataset</button>
    </nav>
    <span class="spacer"></span>
    <span class="conn" id="conn"><i></i><span>Connected</span></span>
  </header>

  <main id="predict" class="view hidden"><div class="page" id="pPage"><div class="wrap" id="pWrap"></div></div></main>

  <main id="notebook" class="view hidden">
    <aside class="nb-side">
      <div class="nb-side-top">
        <h2>Thesis pipeline</h2>
        <div class="nb-progress"><div class="prog-top"><span id="nbDone">–</span><span id="nbTotal"></span></div><div class="bar"><span id="nbBar" style="width:0"></span></div></div>
        <div class="nb-actions">
          <button class="btn sm" id="runAll" title="Run every step in order (stops at the first error)"><svg class="ic"><use href="#i-playall"/></svg>Run all</button>
          <button class="btn sm danger hidden" id="stopAll" title="Stop the running step and clear the queue"><svg class="ic"><use href="#i-stop"/></svg>Stop</button>
          <button class="btn sm" id="restart" title="Restart the Python kernel - clears variables, keeps saved results"><svg class="ic"><use href="#i-refresh"/></svg>Restart kernel</button>
        </div>
        <div class="kernel" id="kernel"><i></i><span>Kernel idle</span></div>
      </div>
      <div class="nb-list" id="nbList"></div>
    </aside>
    <section class="nb-main">
      <div class="nb-head">
        <div class="title"><div class="crumb" id="nbCrumb"></div><h1 id="nbTitle">–</h1><div class="meta" id="nbMeta"></div></div>
        <div class="acts">
          <select class="input" id="nbHistory" title="Earlier runs of this step"></select>
          <button class="btn icon" id="nbToggleCode" title="Show / hide code"><svg class="ic"><use href="#i-code"/></svg></button>
          <button class="btn" id="nbReset" title="Restore the original step code"><svg class="ic"><use href="#i-undo"/></svg>Reset code</button>
          <button class="btn primary" id="nbRun"></button>
        </div>
      </div>
      <div class="nb-body" id="nbBody">
        <div class="pane code-pane">
          <div class="pane-head"><span class="ttl"><svg class="ic"><use href="#i-code"/></svg>code.py</span><span class="mod-tag hidden" id="nbMod">modified</span><span class="spacer"></span><span class="hint">⌘ / Ctrl + Enter to run</span></div>
          <div class="editor-wrap">
            <pre class="gutter" id="nbGutter" aria-hidden="true"></pre>
            <div class="code-area"><pre id="nbHl" aria-hidden="true"></pre><textarea id="nbEditor" spellcheck="false" wrap="off" autocapitalize="off" autocomplete="off"></textarea></div>
          </div>
        </div>
        <div class="divider" id="nbDivider" title="Drag to resize · double-click to reset"></div>
        <div class="pane out-pane">
          <div class="pane-head"><div class="ptabs" id="nbTabs"></div><span class="spacer"></span><span class="hint" id="nbSaved"></span></div>
          <div class="out-body" id="nbOut"></div>
        </div>
      </div>
    </section>
  </main>

  <main id="compare" class="view hidden"><div class="page" id="cPage"><div class="wrap wide" id="cWrap"></div></div></main>
  <main id="dataset" class="view hidden"><div class="page"><div class="wrap wide" id="dWrap"></div></div></main>

  <script src="/static/js/core.js"></script>
  <script src="/static/js/predict.js"></script>
  <script src="/static/js/notebook.js"></script>
  <script src="/static/js/compare.js"></script>
  <script src="/static/js/dataset.js"></script>
</body>
</html>
